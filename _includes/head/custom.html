{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png" />
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192" />
<link rel="manifest" href="{{ base_path }}/images/manifest.json" />
<link rel="icon" href="/images/favicon.ico" />
<meta name="theme-color" content="#ffffff" />

<!-- Subtle card styling for CV & Publications -->
<style>
  .page__content {
    line-height: 1.7;
  }

  h2 {
    border-bottom: 2px solid var(--global-theme-color, #52adc8);
    padding-bottom: 0.3em;
  }

  /* CV cards — left accent, clean spacing */
  .cv-card ul {
    list-style: none;
    margin-left: 0;
    padding-left: 0;
  }

  .cv-card ul>li {
    padding: 0.8em 1em 0.8em 1.25em;
    margin-bottom: 0.6em;
    border-left: 3px solid var(--global-theme-color, #52adc8);
    border-radius: 4px;
  }

  .cv-card ul>li ul {
    margin-top: 0.3em;
  }

  .cv-card ul>li ul>li {
    padding: 0.15em 0;
    margin-bottom: 0;
    border: none;
    font-size: 0.95em;
  }

  /* Publication cards */
  .pub-card {
    padding: 0.8em 1em 0.6em 1.25em;
    margin-bottom: 0.6em;
    border-left: 3px solid var(--global-theme-color, #52adc8);
    border-radius: 4px;
  }

  .pub-card p {
    margin: 0.15em 0;
  }
</style>

<!-- end custom head snippets -->
