summary:
  en: >-
    My research focuses on operating-system security and program analysis for C/C++ systems, with recent work on applying LLMs to security analysis and software engineering tasks. I build and evaluate tools that combine fuzzing, static analysis, symbolic execution, and LLM-based program analysis for real-world systems such as Linux, Android, and HarmonyOS kernels. My work includes LLM-assisted static analysis, automated kernel fuzzing specification generation, and exploitability/security analysis workflows. These projects have led to papers in S\&P, USENIX Security, CCS, NDSS, ICSE, FSE, OOPSLA, and TSE, several open-source tools, invited talks, Linux kernel bug/CVE reports, and patches.
  cn: >-
    我的研究集中在操作系统安全和C/C++程序分析，近期工作包括将大语言模型用于安全分析和软件工程任务。我构建结合Fuzzing、静态分析、符号执行和LLM推理的工具，用于Linux、Android、鸿蒙内核等真实系统。相关工作包括LLM辅助静态分析、内核Fuzzing规格自动生成、漏洞可利用性分析和系统安全分析流程。研究成果发表在S\&P、USENIX Security、CCS、NDSS、ICSE、FSE、OOPSLA和TSE等会议/期刊，并产出多个开源工具、报告Linux内核漏洞/CVE和贡献补丁。
